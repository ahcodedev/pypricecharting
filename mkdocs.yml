site_name: PyPriceCharting
site_description: Python PriceCharting API Client
repo_url: https://github.com/ahcodedev/pypricecharting
repo_name: ahcodedev/pypricecharting
strict: true

theme:
  name: material
  variant: classic
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - API Reference:
      - Clients: api/clients.md
      - Models: api/models.md
      - Requests: api/requests.md
      - Responses: api/responses.md
      - Types: api/types.md
      - Errors: api/errors.md
      - Routes: api/route.md
