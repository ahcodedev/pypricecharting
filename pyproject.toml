[project]
name = "pypricecharting"
description = "Python PriceCharting API Client"
version = "0.0.1"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "ahcodedev" },
]
keywords = ["pricecharting", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
]

[project.urls]
Repository = "https://github.com/ahcodedev/pypricecharting"
Issues = "https://github.com/ahcodedev/pypricecharting/issues"
Documentation = "https://ahcodedev.github.io/pypricecharting/"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "prek>=0.5.10",
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]
docs = [
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.1.0",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 98
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I", "N", "PT", "D", "UP", "RUF", "SIM", "S", "C4", "PTH", "PL", "PERF"]  # Choose your rule categories
ignore = ["D100", "D104", "D415"]
extend-ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105", "PLR2004"]  # Ignore docstring (D), assert (S101), fake token (S105), and magic value (PLR2004) errors in tests

[tool.ruff.format]
quote-style = "double"

[tool.uv]
required-version = ">=0.13,<0.14"
