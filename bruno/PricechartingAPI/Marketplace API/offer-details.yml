info:
  name: /offer-details
  type: http
  seq: 2

http:
  method: GET
  url: https://www.pricecharting.com/api/offer-details?offer-id=
  params:
    - name: offer-id
      value: ""
      type: query
      description: Required. Offer ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Full details for one offer, including buyer shipping info after a sale.

  #### *Response*

  ```json
  {
      "status":"success",
      "buyer": {                                        // buyer's shipping info
          "buyer-email":"[email protected]",
          "shipping-city":"Anytown",
          "shipping-country":"United States",
          "shipping-line1":"123 Smith St",
          "shipping-line2":"",
          "shipping-name":"John Doe",
          "shipping-state":"NY",
          "shipping-zip":"00000-0000"
      },
      "buyer-left-feedback":true,                       // has buyer posted feedback
      "condition":"Normal wear",
      "console-name":"Super Nintendo",
      "cost-basis":125
      "ended-time":"2017-10-31",                        // time the listing ended
      "has-pictures":true,
      "id":7000,
      "includes":"Game only",
      "is-collection":false,
      "is-ended":true,                                  // has offer ended
      "is-price-descending":true,                       // is offer a reverse auction
      "is-refunded":false,                              // has offer been refunded
      "is-shipped":true,                                // has offer been shipped
      "is-sold":true,                                   // has offer sold
      "max-price":12000,
      "min-price":10000,
      "offer-id":"vtdsww72uyslgooawzyyijsllm",          // unique offer ID
      "offer-status":"sold",
      "offer-url":"/offer/vtdsww72uyslgooawzyyijsllm",  // url for offer
      "price":11281,                                    // sales price.  $112.81
      "product-name":"Mega Man 7",
      "refunded-time":"0001-01-01",                     // date of refund.  zero value
      "sale-time":"2017-10-31",
      "seller-left-feedback":true,                      // has seller posted feedback
      "shipped-time":"2017-10-31",                      // date offer shipped.
      "shipping-premium":0,                             // extra paid for shipping internationally
      "sku":"",
      "start-time":"2017-10-20",
      "tracking-number":"9400111234567890000000"        // tracking number for shipment
  }
  ```

  - `buyer`: `buyer-email`, `shipping-name`, `shipping-line1`, `shipping-line2`, `shipping-city`, `shipping-state`, `shipping-zip`, `shipping-country`
  - `buyer-left-feedback`, `seller-left-feedback`
  - `id`, `product-name`, `console-name`, `condition`, `includes`
  - `price`, `max-price`, `min-price`, `cost-basis`, `shipping-premium`
  - `has-pictures`, `is-collection`, `is-ended`, `is-price-descending`, `is-refunded`, `is-shipped`, `is-sold`
  - `offer-id`, `offer-status`, `offer-url`, `sku`, `tracking-number`
  - `start-time`, `sale-time`, `shipped-time`, `ended-time`, `refunded-time`
