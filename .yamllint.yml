# Configuration file for yamllint.
# See https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

ignore: |
  .venv/
  site/
  # Generated by the Bruno app
  bruno/

rules:
  document-start: disable
  # Allow both list styles under a key, as long as each file is consistent
  indentation:
    indent-sequences: consistent
  line-length:
    max: 120
  # `on:` in GitHub workflows is a key, not a boolean
  truthy:
    check-keys: false
  brackets:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
